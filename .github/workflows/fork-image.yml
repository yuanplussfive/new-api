name: Build and publish fork image

on:
  push:
    branches: [main]
    tags: ['senera-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.repository == 'yuanplussfive/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-root-password
          MYSQL_DATABASE: codex_afdian_test
          MYSQL_USER: codex_afdian
          MYSQL_PASSWORD: test-only-payment-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: codex_afdian_test
          POSTGRES_USER: codex_afdian
          POSTGRES_PASSWORD: test-only-payment-password
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U codex_afdian -d codex_afdian_test"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: 'codex_afdian:test-only-payment-password@tcp(127.0.0.1:3306)/codex_afdian_test?charset=utf8mb4&parseTime=true'
      TEST_POSTGRES_DSN: 'postgres://codex_afdian:test-only-payment-password@127.0.0.1:5432/codex_afdian_test?sslmode=disable'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Prepare embed placeholder
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Verify payment integration on SQLite, MySQL and PostgreSQL
        run: go test ./controller ./model ./service ./setting ./middleware -run Afdian -count=1 -v
      - name: Vet affected backend packages
        run: go vet ./controller ./model ./service ./setting ./middleware
      - name: Verify authentication route declarations
        run: go test ./middleware ./router -count=1
      - name: Verify login and session security regressions
        run: |
          go test ./service -run 'Auth|Login|Security|Refresh|Session' -count=1
          go test ./controller -run '^Test(SecurityLogin|OAuthLogin|GenerateOAuthCode|AuthLogout|SessionLimitDoesNotRecord|SetupLogin|WriteAuthSessionError)' -count=1

  frontend:
    if: github.repository == 'yuanplussfive/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun check -b
      - run: bun run test src/features/wallet src/features/subscriptions src/features/system-settings/integrations src/lib/auth-session.test.ts
      - run: bun run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Stamp fork build version
        run: echo "$(git describe --tags --match 'v*' --always)-afdian" > VERSION
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/yuanplussfive/new-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=afdian,enable=${{ github.ref == 'refs/heads/codex/afdian-payment' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
