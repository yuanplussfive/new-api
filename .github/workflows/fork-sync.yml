name: Sync upstream and rebuild fork

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yuanplussfive/new-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git fetch https://github.com/QuantumNous/new-api.git main
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit FETCH_HEAD
          git push origin HEAD:main
      # Pushes made with GITHUB_TOKEN do not trigger push workflows. Dispatch
      # explicitly, including when already up to date, to allow a rebuild.
      - name: Rebuild and publish merged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run fork-image.yml --ref main
